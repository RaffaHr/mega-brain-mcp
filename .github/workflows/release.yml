name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require package version tag from main
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME must equal package version $expected_tag" >&2
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit reachable from origin/main" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run test:spec
      - name: onp-spec audit --ci
        run: npm run audit
      - run: npm pack --dry-run

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: npm ci
      - run: npm run build
      - run: npm sbom --sbom-format cyclonedx > mega-brain-mcp.cdx.json
      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token exchange.
      # Explicit --provenance flag required by contracts and tests.
      - run: npm publish --provenance --access public
