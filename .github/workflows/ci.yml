name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supported-hosts:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Codex + Claude
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20.20.0, 22.22.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Codex and Claude hook compatibility
        run: npm test
      - run: npm run benchmark
      - run: npm run test:spec
      - name: onp-spec audit --ci
        run: npm run audit
      - run: npm pack --dry-run
